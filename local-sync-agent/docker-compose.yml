services:
  bp-sync-agent:
    image: ghcr.io/helter5/bp-local-sync-agent:latest
    container_name: bp-sync-agent
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      # Docker containers reach the host machine through this name on macOS/Windows.
      BP_ARENA_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
